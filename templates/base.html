<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Warehouse + Uzum" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-semibold" href="/groups">Warehouse</a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      <a class="btn btn-outline-secondary btn-sm" href="/groups">Products</a>
      <a class="btn btn-outline-dark btn-sm" href="/products/new">+ Add</a>
      <button class="btn btn-dark btn-sm" data-bs-toggle="modal" data-bs-target="#syncModal">Sync Uzum</button>
    </div>
  </div>
</nav>

<main class="container-fluid px-3 py-4">
  {% block content %}{% endblock %}
</main>

<!-- Sync Modal -->
<div class="modal fade" id="syncModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Sync Uzum products</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12 col-lg-6">
            <label class="form-label">Worker Base URL</label>
            <input id="syncWorkerBase" class="form-control" placeholder="https://uzum-api....workers.dev">
            <div class="form-text">If empty, backend uses env var <code>UZUM_WORKER_BASE</code>.</div>
          </div>
          <div class="col-6 col-lg-3">
            <label class="form-label">Shop ID</label>
            <input id="syncShopId" class="form-control" placeholder="5983">
          </div>
          <div class="col-6 col-lg-3">
            <label class="form-label">Page size</label>
            <input id="syncSize" class="form-control" type="number" min="10" max="200" value="50">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="syncAll" checked>
              <label class="form-check-label" for="syncAll">Sync all pages (import all products)</label>
            </div>
          </div>
          <div class="col-12">
            <div class="alert alert-secondary mb-0 small" id="syncResult" style="display:none;"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-dark" id="btnDoSync">Sync now</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/uzum_ui.js"></script>
</body>
</html>
